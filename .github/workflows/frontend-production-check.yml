name: Frontend Production Check

on:
  workflow_dispatch:
  push:
    branches: [ui-redesign, feat/production-agent-backend]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-production-check.yml"
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-production-check.yml"

concurrency:
  group: frontend-production-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
