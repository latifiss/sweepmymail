name: Backend production check

on:
  workflow_dispatch:
  push:
    paths:
      - "backend/**"
      - ".github/workflows/backend-production-check.yml"

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies and regenerate lockfile
        run: npm install

      - name: Commit regenerated lockfile
        working-directory: .
        run: |
          if git diff --quiet -- backend/package-lock.json; then
            echo "package-lock.json is already up to date"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/package-lock.json
          git commit -m "chore: regenerate backend package lockfile"
          git push

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build
